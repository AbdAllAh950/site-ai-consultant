# Server + automatic HTTPS (Caddy, Let's Encrypt) + n8n for automations.
#   cp .env.example .env    # keys and DOMAIN
#   docker compose up -d --build
# n8n editor: https://n8n.<DOMAIN>/  (first visit creates the owner account)
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./sites:/srv/sites:ro      # edit knowledge bases without rebuilding — changes apply on the next message
      - data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
  n8n:
    image: n8nio/n8n:2.41.4
    restart: unless-stopped
    environment:
      # what the lead workflow reads with $env (listed one by one, so app deploys don't restart n8n)
      LLM_URL: ${LLM_URL:-}
      LLM_AUTH: ${LLM_AUTH:-}
      LLM_PROJECT: ${LLM_PROJECT:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_SUMMARY_MODEL: ${LLM_SUMMARY_MODEL:-}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-https://api.telegram.org}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      LEADS_TELEGRAM_CHAT_ID: ${LEADS_TELEGRAM_CHAT_ID:-}
      N8N_HOST: n8n.${DOMAIN}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.${DOMAIN}/
      N8N_PROXY_HOPS: 1
      GENERIC_TIMEZONE: Europe/Moscow
      TZ: Europe/Moscow
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_DEFAULT_LOCALE: en
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro
volumes:
  data:
  caddy_data:
  n8n_data:
